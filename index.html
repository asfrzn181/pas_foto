<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galery Atma Luhur</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1;
            --secondary-color: #8b5cf6;
            --success-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px 0;
        }

        .main-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            margin: 20px auto;
            max-width: 1400px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 3px solid #e5e7eb;
        }

        .header-section h1 {
            font-size: 3em;
            font-weight: 800;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-section p {
            color: #6b7280;
            font-size: 1.1em;
        }

        .form-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .form-card label {
            color: white;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.95em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            border-radius: 10px;
            border: 2px solid transparent;
            padding: 12px 15px;
            font-size: 1em;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 0.2rem rgba(139, 92, 246, 0.25);
        }

        .btn-generate {
            background: white;
            color: #667eea;
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            font-size: 1.1em;
            font-weight: 700;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-generate:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: #f9fafb;
        }

        .btn-generate:active {
            transform: translateY(-1px);
        }

        .stats-bar {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            color: white;
            display: none;
            animation: slideDown 0.5s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats-bar.show {
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-number {
            font-size: 2em;
            font-weight: 800;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loading-overlay.active {
            display: flex;
        }

        .loading-content {
            text-align: center;
            color: white;
        }

        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid white;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .image-card {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            background: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            opacity: 0;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .image-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        .image-wrapper {
            position: relative;
            width: 100%;
            padding-bottom: 100%;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            overflow: hidden;
        }

        .image-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: all 0.3s;
            opacity: 0;
        }

        .image-wrapper img.loaded {
            opacity: 1;
        }

        .image-card:hover img {
            transform: scale(1.1);
        }

        .image-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            color: white;
            padding: 15px;
            transform: translateY(100%);
            transition: transform 0.3s;
        }

        .image-card:hover .image-overlay {
            transform: translateY(0);
        }

        .image-id {
            font-weight: 700;
            font-size: 1.1em;
            margin-bottom: 5px;
        }

        .image-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            text-align: center;
        }

        .btn-view {
            background: #3b82f6;
        }

        .btn-view:hover {
            background: #2563eb;
            color: white;
        }

        .btn-download {
            background: #10b981;
        }

        .btn-download:hover {
            background: #059669;
            color: white;
        }

        .loading-placeholder {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #9ca3af;
            font-size: 2em;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }

        .no-results i {
            font-size: 4em;
            margin-bottom: 20px;
            color: #d1d5db;
        }

        .filter-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
        }

        .view-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .view-btn.active {
            background: #667eea;
            color: white;
        }

        .image-grid.grid-view {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }

        .image-grid.list-view {
            grid-template-columns: 1fr;
        }

        .list-view .image-wrapper {
            padding-bottom: 40%;
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 20px;
            }

            .header-section h1 {
                font-size: 2em;
            }

            .image-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 15px;
            }

            .stats-bar {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container-fluid">
    <div class="main-container">
        <div class="header-section">
            <h1><i class="fas fa-images"></i> TAKE ME OUT</h1>
            <p>Galeri Foto Mahasiswa Universitas Atma Luhur</p>
        </div>

        <div class="form-card">
            <form id="image-form">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="angkatan"><i class="fas fa-calendar-alt"></i> Angkatan</label>
                        <select id="angkatan" name="angkatan" class="form-control">
                            <script>
                                for (let i = 10; i <= 30; i++) {
                                    let year = "20" + i;
                                    let selected = i === 19 ? 'selected' : '';
                                    document.write(`<option value="${i}" ${selected}>${year}</option>`);
                                }
                            </script>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="jurusan"><i class="fas fa-graduation-cap"></i> Jurusan</label>
                        <select id="jurusan" name="jurusan" class="form-control">
                            <option value="11">Teknik Informatika</option>
                            <option value="22">Sistem Informasi</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="tipe"><i class="fas fa-user-graduate"></i> Tipe</label>
                        <select id="tipe" name="tipe" class="form-control">
                            <option value="50">Reguler</option>
                            <option value="52">Non-Reguler</option>
                        </select>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <button type="submit" class="btn-generate">
                        <i class="fas fa-search"></i> Generate Images
                    </button>
                </div>
            </form>
        </div>

        <div id="stats-bar" class="stats-bar">
            <div class="stat-item">
                <span class="stat-number" id="total-count">0</span>
                <span class="stat-label">Total Gambar</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="loaded-count">0</span>
                <span class="stat-label">Berhasil Dimuat</span>
            </div>
            <div class="stat-item">
                <span class="stat-number" id="failed-count">0</span>
                <span class="stat-label">Gagal Dimuat</span>
            </div>
        </div>

        <div class="filter-controls" id="filter-controls" style="display: none;">
            <div class="view-toggle">
                <button class="view-btn active" onclick="setView('grid')">
                    <i class="fas fa-th"></i> Grid
                </button>
                <button class="view-btn" onclick="setView('list')">
                    <i class="fas fa-list"></i> List
                </button>
            </div>
        </div>

        <div class="image-grid grid-view" id="image-container"></div>
    </div>
</div>

<div class="loading-overlay" id="loading-overlay">
    <div class="loading-content">
        <div class="spinner"></div>
        <h3>Memuat gambar...</h3>
        <p>Mohon tunggu sebentar</p>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    let loadedCount = 0;
    let failedCount = 0;
    let totalCount = 0;

    document.getElementById('image-form').addEventListener('submit', function(e) {
        e.preventDefault();
        generateImages();
    });

    function generateImages() {
        const angkatan = document.getElementById('angkatan').value;
        const jurusan = document.getElementById('jurusan').value;
        const tipe = document.getElementById('tipe').value;
        const totalImages = 300;
        const baseUrl = "https://mahasiswa.atmaluhur.ac.id/foto/";
        const imageContainer = document.getElementById('image-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const statsBar = document.getElementById('stats-bar');
        const filterControls = document.getElementById('filter-controls');

        imageContainer.innerHTML = '';
        loadedCount = 0;
        failedCount = 0;
        totalCount = 0;

        loadingOverlay.classList.add('active');
        statsBar.classList.remove('show');
        filterControls.style.display = 'none';

        setTimeout(() => {
            for (let i = 1; i <= totalImages; i++) {
                const formattedNum = i.toString().padStart(4, '0');
                const studentId = `${angkatan}${jurusan}${tipe}${formattedNum}`;
                const imageUrl = `${baseUrl}${studentId}.jpg`;

                if (imageUrl !== `${baseUrl}1922500056.jpg`) {
                    totalCount++;
                    createImageCard(imageUrl, studentId);
                }
            }

            updateStats();
            loadingOverlay.classList.remove('active');
            statsBar.classList.add('show');
            filterControls.style.display = 'flex';
            lazyLoad();
        }, 500);
    }

    function createImageCard(imageUrl, studentId) {
        const imageContainer = document.getElementById('image-container');
        const card = document.createElement('div');
        card.className = 'image-card';
        card.style.animationDelay = `${Math.random() * 0.3}s`;

        card.innerHTML = `
            <div class="image-wrapper">
                <div class="loading-placeholder">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
                <img data-src="${imageUrl}" class="lazy" alt="${studentId}">
                <div class="image-overlay">
                    <div class="image-id">${studentId}</div>
                    <div class="image-actions">
                        <a href="${imageUrl}" target="_blank" class="btn-action btn-view">
                            <i class="fas fa-eye"></i> Lihat
                        </a>
                        <a href="${imageUrl}" download class="btn-action btn-download">
                            <i class="fas fa-download"></i> Download
                        </a>
                    </div>
                </div>
            </div>
        `;

        imageContainer.appendChild(card);
    }

    function lazyLoad() {
        const lazyImages = document.querySelectorAll('img.lazy:not(.loaded):not(.error)');
        
        lazyImages.forEach(img => {
            if (img.getBoundingClientRect().top < window.innerHeight + 500) {
                const imageSrc = img.dataset.src;
                const card = img.closest('.image-card');
                const placeholder = card.querySelector('.loading-placeholder');
                
                const image = new Image();
                image.src = imageSrc;
                
                image.onload = function() {
                    img.src = imageSrc;
                    img.classList.add('loaded');
                    img.classList.remove('lazy');
                    if (placeholder) placeholder.remove();
                    loadedCount++;
                    updateStats();
                };
                
                image.onerror = function() {
                    img.classList.add('error');
                    img.classList.remove('lazy');
                    card.style.display = 'none';
                    failedCount++;
                    updateStats();
                };
            }
        });
    }

    function updateStats() {
        document.getElementById('total-count').textContent = totalCount;
        document.getElementById('loaded-count').textContent = loadedCount;
        document.getElementById('failed-count').textContent = failedCount;
    }

    function setView(viewType) {
        const container = document.getElementById('image-container');
        const buttons = document.querySelectorAll('.view-btn');
        
        buttons.forEach(btn => btn.classList.remove('active'));
        event.target.closest('.view-btn').classList.add('active');
        
        container.className = `image-grid ${viewType}-view`;
    }

    window.addEventListener('scroll', lazyLoad);
    window.addEventListener('resize', lazyLoad);
</script>
</body>
</html>
